# workflow to clean github workflow runs for my repositories

name: Github WF Runs Clean
on:
  push:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '0 4 * * *'

jobs:
  gha_clean:
    runs-on: ubuntu-latest
    name: Github WF Runs Clean
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: check self
      run: |
        python3 ./gh_workflow_runs_delete.py -d  -r grindsa/github_actions_clean -t ${{ secrets.GH_TOKEN }} -u ${{ secrets.GH_USER }} -c 1
    - name: check a2c
      run: |
        python3 ./gh_workflow_runs_delete.py -d  -r grindsa/acme2certifier -t ${{ secrets.GH_TOKEN }} -u ${{ secrets.GH_USER }}  -c 1
    - name: check a2c-profile-editor
      run: |
        python3 ./gh_workflow_runs_delete.py -d  -r grindsa/a2c-eab-profile-editor -t ${{ secrets.GH_TOKEN }} -u ${{ secrets.GH_USER }}  -c 1
    - name: check dkb-robo
      run: |
        python3 ./gh_workflow_runs_delete.py -d  -r grindsa/dkb-robo -t ${{ secrets.GH_TOKEN }} -u ${{ secrets.GH_USER }}  -c 1
    - name: check grindsa/sbom
      run: |
        python3 ./gh_workflow_runs_delete.py -d  -r grindsa/sbom -t ${{ secrets.GH_TOKEN }} -u ${{ secrets.GH_USER }}  -c 1
    - name: check grindsa/yasl
      run: |
        python3 ./gh_workflow_runs_delete.py -d  -r grindsa/yasl -t ${{ secrets.GH_TOKEN }} -u ${{ secrets.GH_USER }} -c 1
    - name: check grindsa/gira-ble-api
      run: |
        python3 ./gh_workflow_runs_delete.py -d  -r grindsa/gira-ble-api -t ${{ secrets.GH_TOKEN }} -u ${{ secrets.GH_USER }} -c 1
    - name: check rindsa/rrs37b-dashboard
      run: |
        python3 ./gh_workflow_runs_delete.py -d  -r grindsa/rrs37b-dashboard -t ${{ secrets.GH_TOKEN }} -u ${{ secrets.GH_USER }} -c 1

    - name: check grindsa/docker-pen
      run: |
        python3 ./gh_workflow_runs_delete.py -d  -r grindsa/docker-pen -t ${{ secrets.GH_TOKEN }} -u ${{ secrets.GH_USER }} -c 1

